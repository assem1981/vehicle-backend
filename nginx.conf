upstream vehicle_backend {
    server localhost:8070;
}

server {
    listen 80;
    server_name _;  # Replace with your domain or server IP

    client_max_body_size 10M;

    location / {
        proxy_pass http://vehicle_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint
    location /actuator/health {
        proxy_pass http://vehicle_backend/actuator/health;
        access_log off;
    }

    # Static files (if any)
    location /static/ {
        proxy_pass http://vehicle_backend/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
